
name: mirror
on:
  push:
    branches: ['**']
    tags: ['**']
  delete:

jobs:
  to-competenceplus:
    if: github.repository == 'EpitechPGE3-2026/G-SVR-500-STG-5-1-survivor-7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:leolcde/CompetencePlus.git
          ssh_private_key: ${{ secrets.MIRROR_SSH_KEY }}
