name: Build

on:
  push:
    branches: [dev, _access_test]
  pull_request:
    branches: [_access_test]

    branches: [dev]
  pull_request:
    branches: [_access_test]

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'jibjob' }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'jibjob' }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'jibjob' }}
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}
  PORT: "8080"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}?sslmode=disable
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: "8080"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'jibjob' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'jibjob' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'jibjob' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER || 'jibjob' }}:${{ secrets.POSTGRES_PASSWORD || 'jibjob' }}@localhost:5432/${{ secrets.POSTGRES_DB || 'jibjob' }}?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -database "$DATABASE_URL" -path ../database/migrations up
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -path ../database/migrations -database "$DATABASE_URL" up

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o dist/jibjob-server .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jibjob-server
          path: backend/dist/jibjob-server
          retention-days: 7
