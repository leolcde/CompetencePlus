name: Build

on:
  push:
    branches: [dev, _access_test]
  pull_request:
    branches: [_access_test]

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'profilsactifs' }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'profilsactifs' }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'profilsactifs' }}
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}
  PORT: "8080"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'profilsactifs' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'profilsactifs' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'profilsactifs' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER || 'profilsactifs' }}:${{ secrets.POSTGRES_PASSWORD || 'profilsactifs' }}@localhost:5432/${{ secrets.POSTGRES_DB || 'profilsactifs' }}?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -path ../database/migrations -database "$DATABASE_URL" up

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o dist/profilsactifs-server .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: profilsactifs-server
          path: backend/dist/profilsactifs-server
          retention-days: 7
