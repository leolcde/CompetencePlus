name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [_access_test]

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}?sslmode=disable
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  PORT: "8080"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run migrations
        run: |
          go run ./cmd/migrate up

      - name: Seed demo accounts
        run: |
          go run ./cmd/seed

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o dist/jibjob-server .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jibjob-server
          path: dist/jibjob-server
          retention-days: 7
